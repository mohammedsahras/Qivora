org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
# Flutter 3.47.5 requires android.newDsl=false with AGP 9 (the Flutter Gradle
# plugin fails otherwise). Kept as false per Flutter's requirement.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation writes cross-drive cache paths (Pub cache on C:
# vs project on D:), which fails with "this and base files have different roots".
# Reversible workaround for the incremental-cache error; can be removed later.
kotlin.incremental=false

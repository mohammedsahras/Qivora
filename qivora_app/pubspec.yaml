name: qivora_app
description: Qivora - Connect Beyond Messages
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^13.0.0
  uuid: ^4.4.2
  intl: ^0.19.0
  bcrypt: ^1.1.3
  record: ^7.1.2
  just_audio: ^0.10.6
  video_player: ^2.14.1
  web_socket_channel: ^3.0.3
  provider: ^6.1.5+1
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/qivora_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00A878"
  adaptive_icon_foreground: "assets/images/qivora_logo.png"
